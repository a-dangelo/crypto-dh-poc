name: Check independent hash commitment

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hash-commitment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: '2'
      BUILD_JOBS: '2'
      OPAMJOBS: '2'
      OPAMROOT: ${{ github.workspace }}/Examples/HashCommitment/vendor/opam-root
      OPAMSWITCH: hash-commitment-5.3.0
      MATHLIB_CACHE_DIR: ${{ github.workspace }}/Examples/HashCommitment/vendor/mathlib-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reserve space on the disposable hosted runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_ACTIONS:-}" == true && "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]
          available_kib() { df --output=avail -k "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' '; }
          required_kib=$((24 * 1024 * 1024))
          # Only fixed SDK directories in the disposable image; no project data.
          if (( $(available_kib) < required_kib )) && [[ -d /usr/local/lib/android/sdk ]]; then
            [[ "$(realpath -e /usr/local/lib/android/sdk)" == /usr/local/lib/android/sdk ]]
            [[ -d /usr/local/lib/android/sdk/platform-tools ]]
            sudo rm -rf -- /usr/local/lib/android/sdk
          fi
          if (( $(available_kib) < required_kib )) && [[ -d /usr/share/dotnet ]]; then
            [[ "$(realpath -e /usr/share/dotnet)" == /usr/share/dotnet ]]
            [[ -x /usr/share/dotnet/dotnet && -d /usr/share/dotnet/sdk ]]
            sudo rm -rf -- /usr/share/dotnet
          fi
          df -h "$GITHUB_WORKSPACE"
          (( $(available_kib) >= required_kib ))
      - name: Install pinned official elan
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/elan-installer"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan-installer"
          "$RUNNER_TEMP/elan-installer/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned build dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        continue-on-error: true
        with:
          path: |
            Examples/HashCommitment/vendor
            Examples/HashCommitment/lean/.lake
            Examples/HashCommitment/rust/target
          key: hash-commitment-check-${{ runner.os }}-${{ hashFiles('Examples/HashCommitment/patches/**', 'Examples/HashCommitment/lean/lake-manifest.json', 'Examples/HashCommitment/scripts/bootstrap.sh', 'Examples/HashCommitment/rust/Cargo.lock') }}-${{ hashFiles('Examples/HashCommitment/**/*.lean', 'Examples/HashCommitment/**/*.rs') }}
          restore-keys: |
            hash-commitment-check-${{ runner.os }}-${{ hashFiles('Examples/HashCommitment/patches/**', 'Examples/HashCommitment/lean/lake-manifest.json', 'Examples/HashCommitment/scripts/bootstrap.sh', 'Examples/HashCommitment/rust/Cargo.lock') }}-
      - name: Prepare pinned OCaml compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y opam build-essential pkg-config libgmp-dev m4 bubblewrap
          if [[ ! -f "$OPAMROOT/config" ]]; then
            opam init --bare --no-setup -y
          fi
          if ! opam switch list --short | grep -Fxq "$OPAMSWITCH"; then
            opam switch create "$OPAMSWITCH" ocaml-base-compiler.5.3.0 -y --jobs=2
          fi
          eval "$(opam env --switch="$OPAMSWITCH" --set-switch)"
          [[ "$(ocamlc -version)" == 5.3.0 ]]
          opam var bin >> "$GITHUB_PATH"
          # rustup is provided by the official Ubuntu hosted image. The next
          # preparation step installs the exact nightly selected by Charon.
          command -v rustup
          elan toolchain install "$(cat Examples/HashCommitment/lean/lean-toolchain)"
      - name: Prepare independent dependencies
        run: bash Examples/HashCommitment/scripts/bootstrap.sh
      - name: Prepare pinned Rust and official Lean cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_RUST'
          import os, pathlib, subprocess, tomllib
          spec = tomllib.loads(pathlib.Path('Examples/HashCommitment/vendor/aeneas/charon/rust-toolchain').read_text())['toolchain']
          assert spec['channel'] == 'nightly-2026-09-17'
          assert set(spec['components']) == {'rustc-dev', 'llvm-tools', 'rust-src', 'miri'}
          subprocess.run(['rustup', 'toolchain', 'install', spec['channel'], '--profile', 'minimal',
                          '--component', ','.join(spec['components']), '--no-self-update'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RUSTUP_TOOLCHAIN=' + spec['channel'] + '\n')
          PY_RUST
          (cd Examples/HashCommitment/lean && lake exe cache get)
      - name: Check Rust, extraction, Lean and axioms
        run: bash Examples/HashCommitment/scripts/check.sh
      - name: Save checked build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            Examples/HashCommitment/vendor
            Examples/HashCommitment/lean/.lake
            Examples/HashCommitment/rust/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Keep check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hash-commitment-check-evidence
          path: Examples/HashCommitment/evidence
          if-no-files-found: error
          retention-days: 7
